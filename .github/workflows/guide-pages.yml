name: guide-pages

# Publishes the player guide (docs/guide, plus the screenshots it uses from docs/img) to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "docs/img/**", ".github/workflows/guide-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/guide _site/guide
          cp -r docs/img _site/img
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=guide/"><a href="guide/">River Azoth Guide</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
